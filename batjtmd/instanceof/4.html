<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继承</title>
</head>
<body>
    <script>
        function Animal(){
            this.species = '动物';
        }

        function Cat(name,color){
            Animal.apply(this);
            this.name = name;
            this.color = color;
        }

        const cat =new Cat('大毛','黄色');
        console.log(cat.species);
    </script>
</body>
</html>
