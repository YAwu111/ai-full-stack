<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>移动端俄罗斯方块</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      touch-action:none;
    }

    body{
      background:#111;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      height:100vh;
      overflow:hidden;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .game-wrap{
      width:100%;
      max-width:520px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      padding:12px;
    }

    .top{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:18px;
      padding:0 10px;
    }

    canvas{
      background:#000;
      border:4px solid #333;
      border-radius:12px;
      width:100%;
      max-width:320px;
      aspect-ratio:1/2;
    }

    .controls{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
      user-select:none;
    }

    .row{
      display:flex;
      justify-content:center;
      gap:12px;
    }

    button{
      border:none;
      background:#222;
      color:#fff;
      font-size:22px;
      border-radius:16px;
      padding:18px 24px;
      min-width:80px;
      min-height:70px;
      box-shadow:
        0 4px 0 #000,
        inset 0 2px 2px rgba(255,255,255,.1);
    }

    button:active{
      transform:translateY(2px);
      box-shadow:
        0 2px 0 #000,
        inset 0 2px 2px rgba(255,255,255,.1);
    }

    .start{
      background:#00b894;
      font-size:20px;
    }

    .tip{
      opacity:.7;
      font-size:14px;
      text-align:center;
      line-height:1.5;
    }
  </style>
</head>

<body>

  <div class="game-wrap">

    <div class="top">
      <div>分数：<span id="score">0</span></div>
      <button class="start" id="restartBtn">重新开始</button>
    </div>

    <canvas id="game"></canvas>

    <div class="controls">

      <div class="row">
        <button id="rotate">旋转</button>
      </div>

      <div class="row">
        <button id="left">←</button>
        <button id="down">↓</button>
        <button id="right">→</button>
      </div>

    </div>

    <div class="tip">
      左右移动 / 下落 / 旋转<br>
      专门适配移动端触控
    </div>

  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreDom = document.getElementById('score');

    canvas.width = 300;
    canvas.height = 600;

    const COL = 10;
    const ROW = 20;
    const SIZE = canvas.width / COL;

    let score = 0;
    let gameOver = false;

    const colors = [
      null,
      '#00cec9',
      '#6c5ce7',
      '#fdcb6e',
      '#e17055',
      '#00b894',
      '#d63031',
      '#0984e3'
    ];

    const shapes = [
      [],
      [[1,1,1,1]],

      [
        [2,0,0],
        [2,2,2]
      ],

      [
        [0,0,3],
        [3,3,3]
      ],

      [
        [4,4],
        [4,4]
      ],

      [
        [0,5,5],
        [5,5,0]
      ],

      [
        [6,6,0],
        [0,6,6]
      ],

      [
        [0,7,0],
        [7,7,7]
      ]
    ];

    function createBoard(){
      return Array.from({length:ROW}, () => Array(COL).fill(0));
    }

    let board = createBoard();

    function randomPiece(){
      const type = Math.floor(Math.random() * 7) + 1;

      return {
        x:3,
        y:0,
        shape:shapes[type],
        color:type
      };
    }

    let piece = randomPiece();

    function drawCell(x,y,color){
      ctx.fillStyle = color;
      ctx.fillRect(
        x * SIZE,
        y * SIZE,
        SIZE - 1,
        SIZE - 1
      );
    }

    function drawBoard(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      board.forEach((row,y)=>{
        row.forEach((value,x)=>{
          if(value){
            drawCell(x,y,colors[value]);
          }
        });
      });
    }

    function drawPiece(){
      piece.shape.forEach((row,y)=>{
        row.forEach((value,x)=>{
          if(value){
            drawCell(
              piece.x + x,
              piece.y + y,
              colors[piece.color]
            );
          }
        });
      });
    }

    function collide(){
      for(let y=0;y<piece.shape.length;y++){
        for(let x=0;x<piece.shape[y].length;x++){

          if(piece.shape[y][x]){

            let newX = piece.x + x;
            let newY = piece.y + y;

            if(
              newX < 0 ||
              newX >= COL ||
              newY >= ROW ||
              (newY >= 0 && board[newY][newX])
            ){
              return true;
            }

          }

        }
      }

      return false;
    }

    function merge(){
      piece.shape.forEach((row,y)=>{
        row.forEach((value,x)=>{
          if(value){
            board[piece.y + y][piece.x + x] = piece.color;
          }
        });
      });
    }

    function clearLines(){

      let lines = 0;

      outer:
      for(let y = ROW - 1; y >= 0; y--){

        for(let x = 0; x < COL; x++){
          if(board[y][x] === 0){
            continue outer;
          }
        }

        const row = board.splice(y,1)[0].fill(0);
        board.unshift(row);

        lines++;
        y++;
      }

      if(lines > 0){
        score += lines * 100;
        scoreDom.innerText = score;
      }
    }

    function rotate(){

      const newShape = piece.shape[0]
        .map((_,i)=>
          piece.shape.map(row=>row[i]).reverse()
        );

      const oldShape = piece.shape;

      piece.shape = newShape;

      if(collide()){
        piece.shape = oldShape;
      }
    }

    function move(dir){
      piece.x += dir;

      if(collide()){
        piece.x -= dir;
      }
    }

    function drop(){

      piece.y++;

      if(collide()){

        piece.y--;

        merge();

        clearLines();

        piece = randomPiece();

        if(collide()){
          gameOver = true;
          alert('游戏结束');
        }
      }
    }

    function update(){

      if(gameOver) return;

      drop();

      draw();

    }

    function draw(){
      drawBoard();
      drawPiece();
    }

    let dropInterval = setInterval(update,500);

    // =========================
    // 按钮控制
    // =========================

    document.getElementById('left')
      .addEventListener('touchstart',()=>{
        move(-1);
        draw();
      });

    document.getElementById('right')
      .addEventListener('touchstart',()=>{
        move(1);
        draw();
      });

    document.getElementById('down')
      .addEventListener('touchstart',()=>{
        drop();
        draw();
      });

    document.getElementById('rotate')
      .addEventListener('touchstart',()=>{
        rotate();
        draw();
      });

    // =========================
    // 键盘支持
    // =========================

    document.addEventListener('keydown',(e)=>{

      if(e.key === 'ArrowLeft'){
        move(-1);
      }

      if(e.key === 'ArrowRight'){
        move(1);
      }

      if(e.key === 'ArrowDown'){
        drop();
      }

      if(e.key === 'ArrowUp'){
        rotate();
      }

      draw();
    });

    // =========================
    // 重开
    // =========================

    document.getElementById('restartBtn')
      .addEventListener('click',()=>{

        board = createBoard();

        piece = randomPiece();

        score = 0;
        scoreDom.innerText = 0;

        gameOver = false;

        draw();
      });

    draw();
  </script>

</body>
</html>
