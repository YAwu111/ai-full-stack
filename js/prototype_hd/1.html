<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继承</title>
</head>
<body>
    <script>
        // 父类
        function Animal(name,age){
            this.name = name;
            this.age = age;
        }
        Animal.prototype.sepcies = '动物';
        // 子类
        function Cat(name,age,color){
            Animal.call(this,name,age);
            this.color = color;
        }
        const cat = new Cat('小猫',1,'白色');
        console.log(cat);

        Cat.prototype = Object.create(Animal.prototype);
