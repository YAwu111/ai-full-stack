        // foo();// 普通蛤属运行时，指向全局对象，window.foo()

        // foo是声明在全局作用域变量环境，挂载在window对象上，污染了全局对象

        let bar = {
            test1 : 1,
            myName:'即可帮'
        }
        function foo(){
            this.myName = '即可时间';
        }
        foo.call(bar); // 显式绑定，指向bar对象
        console.log(bar.myName);

        var myObj = {
            name:'即可时间',
            showThis:function(){
                console.log(this);
            }
        };
    </script>
