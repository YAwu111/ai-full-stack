<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const p = new Promise((resolve,reject)=>{
            console.log('1');
            setTimeout(()=>{
                console.log('3');
                resolve('完成了');
            },1000);
        });
        console.log('2');
        p.then(data=>{
            console.log(data);
        }).catch(err=>{
            console.log(err);
        })

        console.log(p.__proto__ === Promise.prototype,'///////////');
        console.log(p.__proto__,'///////////');
    </script>
</body>
</html>
